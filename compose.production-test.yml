# Local production-like validation ONLY — this is NOT the Coolify deploy config.
#
# It builds each service from its OWN folder as the Docker context (proving the
# repository split works) and runs them together against an EXTERNAL MongoDB
# (Atlas), exactly as production will. Bring your own test values via a local,
# uncommitted env file:
#
#   cp compose.production-test.env.example compose.production-test.env
#   # edit compose.production-test.env with TEST values (never real prod secrets)
#   docker compose -f compose.production-test.yml --env-file compose.production-test.env up --build
#
# TWO services, mirroring what Coolify must create (see COOLIFY_DEPLOYMENT.md):
#   frontend — static bundle behind nginx
#   backend  — HTTP API **and** the automation engine, in one process
#
# There is no queue broker: the automation engine polls MongoDB (the runs
# collection IS the queue, and each automation carries its own `nextRunAt`). One
# database is the whole infrastructure.
#
# A dedicated worker process is still possible for a bigger install — set
# EMBEDDED_WORKER=false on the API and run a second container with
# `npm run start:worker` from this same image — but it is not needed here.

name: comunicacaoai-prod-test

services:
  backend:
    build:
      context: ./backend
    # PID-1 reaping + clean SIGTERM forwarding so graceful shutdown works: the
    # engine drains in-flight automation runs before the process exits.
    init: true
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in compose.production-test.env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      # Default to the frontend container's published origin for a two-origin test.
      # Estas três declaram ORIGENS PÚBLICAS — para CORS, cookies e links — e não alvos
      # de conexão: nada aqui disca para elas. Por isso o teste roda com os domínios
      # reais em https e com `NODE_ENV=production` de verdade, exercitando a validação
      # inteira em vez de afrouxá-la.
      #
      # Não existe flag de escape: uma variável que desligasse a exigência de https
      # existiria também em produção, e um dia alguém a usaria lá.
      CLIENT_URL: ${CLIENT_URL:-https://comunicacaoai.onplataform.com}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.comunicacaoai.onplataform.com}
      PUBLIC_URL: ${PUBLIC_URL:-https://api.comunicacaoai.onplataform.com}
      # Optional providers — blank is fine, the app starts without them.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    networks: [appnet]
    # Give in-flight automation runs room to drain before SIGKILL.
    stop_grace_period: 30s
    # Readiness gate: healthy only once MongoDB answers a ping (uses Node's global
    # fetch; no curl/wget needed in the slim image).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Public build-time value: baked into the browser bundle. In a real deploy
        # this is the backend's public origin (https://api.comunicacaoai.onplataform.com).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks: [appnet]
    depends_on:
      backend:
        condition: service_healthy
    # busybox wget ships in the nginx-unprivileged alpine image.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  appnet:
    driver: bridge
