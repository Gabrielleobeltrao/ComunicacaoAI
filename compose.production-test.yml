# Local production-like validation ONLY — this is NOT the Coolify deploy config.
#
# It builds each service from its OWN folder as the Docker context (proving the
# repository split works) and runs them together against an EXTERNAL MongoDB
# (Atlas), exactly as production will. Bring your own test values via a local,
# uncommitted env file:
#
#   cp compose.production-test.env.example compose.production-test.env
#   # edit compose.production-test.env with TEST values (never real prod secrets)
#   docker compose -f compose.production-test.yml --env-file compose.production-test.env up --build
#
# FOUR services, mirroring what Coolify must create (see COOLIFY_DEPLOYMENT.md):
#   frontend         — static bundle behind nginx
#   backend-api      — HTTP API, the only one with a published port
#   backend-worker   — automations: run queue + scheduler. SAME image as the API,
#                      different command. Without it, scheduled routines never run.
#   redis            — private queue broker; no published port, no public access.
#
# API and worker are separate processes on purpose: never `concurrently` inside one
# production container, so each can be restarted, scaled and observed on its own.

name: comunicacaoai-prod-test

# Everything the API and the worker both need. YAML anchors keep the two service
# definitions honest — a variable added here reaches both, so they can never drift.
x-backend-env: &backend-env
  NODE_ENV: production
  MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in compose.production-test.env}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  # Internal hostname on the compose network — Redis is never reachable from outside.
  REDIS_URL: redis://redis:6379
  CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
  # Optional providers — blank is fine, the app starts without them.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}

services:
  redis:
    image: redis:7-alpine
    # Private by design: attached to the internal network with NO ports mapping, so
    # it is reachable only as `redis:6379` from the other containers.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [appnet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend-api:
    build:
      context: ./backend
    # PID-1 reaping + clean SIGTERM forwarding so graceful shutdown works.
    init: true
    command: ["npm", "run", "start:api"]
    environment:
      <<: *backend-env
      PORT: "4000"
    # The ONLY service with a published port.
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    networks: [appnet]
    depends_on:
      redis:
        condition: service_healthy
    # Readiness gate: healthy only once MongoDB answers a ping (uses Node's global
    # fetch; no curl/wget needed in the slim image).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend-worker:
    # Same image as the API — only the command differs.
    build:
      context: ./backend
    init: true
    command: ["npm", "run", "start:worker"]
    environment: *backend-env
    # No `ports`: the worker serves no HTTP and must never be publicly reachable.
    networks: [appnet]
    depends_on:
      redis:
        condition: service_healthy
    # Give in-flight automation runs room to drain before SIGKILL (the worker's own
    # emergency brake fires at 20s).
    stop_grace_period: 30s
    # The worker exits loudly when Mongo or Redis is unreachable (bounded startup
    # probe), so "running" already means "connected". Liveness is the process
    # itself; progress is visible in its logs.
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Public build-time value: baked into the browser bundle. In a real deploy
        # this is the backend's public origin (https://api.comunicacaoai.oneplataforma.com).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks: [appnet]
    depends_on:
      backend-api:
        condition: service_healthy
    # busybox wget ships in the nginx-unprivileged alpine image.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  appnet:
    driver: bridge
