# Local production-like validation ONLY — this is NOT the Coolify deploy config.
#
# It builds each service from its OWN folder as the Docker context (proving the
# repository split works) and runs them together against an EXTERNAL MongoDB
# (Atlas), exactly as production will. Bring your own test values via a local,
# uncommitted env file:
#
#   cp compose.production-test.env.example compose.production-test.env
#   # edit compose.production-test.env with TEST values (never real prod secrets)
#   docker compose -f compose.production-test.yml --env-file compose.production-test.env up --build
#
# Coolify will create and manage the two services separately later; this file is
# only a local integration harness and never ships to the VPS.

name: comunicacaoai-prod-test

services:
  backend:
    build:
      context: ./backend
    # PID-1 reaping + clean SIGTERM forwarding so graceful shutdown works.
    init: true
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in compose.production-test.env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      # Default to the frontend container's published origin for a two-origin test.
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      # Optional providers — blank is fine, the app starts without them.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    networks: [appnet]
    # Readiness gate: healthy only once MongoDB answers a ping (uses Node's global
    # fetch; no curl/wget needed in the slim image).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Public build-time value: baked into the browser bundle. In a real deploy
        # this is the backend's public origin (https://api.comunicacaoai.oneplataforma.com).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks: [appnet]
    depends_on:
      backend:
        condition: service_healthy
    # busybox wget ships in the nginx-unprivileged alpine image.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  appnet:
    driver: bridge
