# Every push and pull request on main/development gets the same checks a developer
# runs locally: a clean install, typecheck, build, both test suites — e o smoke de
# MVP, que sobe a pilha inteira e a exercita como um usuário.
#
# Deliberately hermetic: no secrets, no deploy, no seed, no call to any external
# service, and no broker — the automation queue and scheduler live in MongoDB, and
# both the integration tests and the smoke start their own mongod through
# mongodb-memory-server. O LLM do smoke é um adaptador falso que só existe com
# NODE_ENV=test (backend/test/llmFakeGate.test.mjs prova que produção não alcança).
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# O mínimo que os jobs precisam. Sem isto, o GITHUB_TOKEN vem com escrita no
# repositório — e um passo comprometido (ou uma action trocada por baixo) teria permissão
# para empurrar commit. É o motivo de as actions abaixo estarem fixadas por SHA: tag é um
# ponteiro que o dono da action pode mover.
permissions:
  contents: read

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A syntactically valid URI so modules that read it at import time can load.
      # Nothing connects to it: the integration tests override it with their own
      # in-process mongod.
      MONGODB_URI: mongodb://127.0.0.1:27017/comunicacaoai_ci
      # A chave que `crypto.ts` usa para cifrar credencial de conexão. Só de teste, e
      # de propósito em texto aberto: ela cifra dados que este job mesmo cria e
      # descarta. Um segredo de verdade aqui não protegeria nada e daria a impressão
      # de que o CI tem acesso a alguma conta.
      #
      # Existe porque a suíte NÃO carrega `.env` (ver backend/scripts/run-tests.mjs):
      # antes disso, um teste que esquecia de declarar a chave passava na máquina de
      # quem escreveu e falhava aqui.
      ENCRYPTION_KEY: ci-encryption-key-nao-e-segredo-0000
      CI: true
      # Um só lugar define a pilha do smoke, e os quatro passos abaixo usam o mesmo — inclusive
      # o da limpeza, que precisa apontar para exatamente os mesmos arquivos para derrubar o
      # que subiu.
      COMPOSE_ARGS: -f compose.production-test.yml -f compose.ci-smoke.yml --env-file compose.production-test.env
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Pinned to 20.19+: rolldown (vite's bundler) declares
          # engines.node "^20.19.0 || >=22.12.0", and on an older 20.x npm silently
          # skips its native binding, so the build dies with "Cannot find native
          # binding" instead of a useful error.
          node-version: '20.19'
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Typecheck (backend)
        run: npx tsc --noEmit
        working-directory: backend

      - name: Typecheck (frontend)
        run: npx tsc -b --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build

      # Dependência com falha conhecida é a porta que não precisa ser arrombada. `high`
      # como piso: `critical` sozinho deixaria passar exatamente a faixa que costuma ter
      # execução remota.
      #
      # DUAS FALHAS DIFERENTES, e confundi-las custa caro nos dois sentidos.
      #
      # "Achei uma vulnerabilidade alta" e "não consegui perguntar" não são a mesma coisa. O
      # endpoint de audit devolve `400 Invalid package tree` de forma intermitente — medido:
      # uma em quatro chamadas, com a mesma árvore, sem nada mudar. Tratar isso como
      # vulnerabilidade deixa a barra vermelha por motivo errado, e uma barra que fica vermelha
      # por motivo errado para de ser lida (foi o que aconteceu com esta CI por doze corridas).
      #
      # Tratar o contrário — engolir o erro e seguir verde — é pior: seria chamar de sucesso o
      # que nem chegou a ser verificado.
      #
      # Então: tenta três vezes; se o endpoint responder, o veredito dele MANDA. Se não
      # responder nenhuma vez, o passo falha dizendo que a checagem não aconteceu.
      - name: Dependências vulneráveis (npm audit)
        shell: bash
        run: |
          for tentativa in 1 2 3; do
            saida=$(npm audit --audit-level=high 2>&1) && { echo "$saida"; exit 0; }
            if echo "$saida" | grep -qE 'audit endpoint returned an error|Invalid package tree|ENETUNREACH|ETIMEDOUT'; then
              echo "::warning::npm audit não respondeu (tentativa $tentativa/3) — o endpoint, não a árvore"
              sleep $((tentativa * 5))
              continue
            fi
            # Respondeu e reprovou: é vulnerabilidade de verdade, e ela manda.
            echo "$saida"
            exit 1
          done
          echo "::error::npm audit não conseguiu rodar em 3 tentativas — a verificação NÃO aconteceu, e isso não é sucesso"
          exit 1

      # Segredo commitado não é revogado por `git rm`: ele fica no histórico e no fork de
      # quem clonou. A varredura não tem dependência nem rede — roda igual aqui e na
      # máquina de quem desenvolve (`npm run secret-scan`).
      - name: Segredo no repositório
        run: node scripts/secret-scan.mjs

      # O binário do mongod entre execuções. Sem isto, cada run baixa 76 MB de
      # novo — e era num cache frio que 29 processos disputavam o mesmo download.
      - name: Cache mongod binary
        # v5: a v4 roda em Node 20, que o runner já avisa que vai sair. O aviso não
        # quebra nada hoje e vira falha quando o Node 20 for removido — trocar agora é
        # mais barato que descobrir no dia.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}

      # O CHROMIUM ENTRA AQUI, e não depois — porque a suíte do backend precisa dele.
      #
      # Ele era instalado mais abaixo, para as jornadas do widget. Só que dois casos de
      # `monitoringBrowser` exercitam o motor de renderização de verdade: "a página que só
      # existe DEPOIS do JavaScript é lida" e "sem dado estruturado, o degrau caro é tentado".
      # Sem navegador, o worker devolve `render: false` — que é o comportamento certo dele — e
      # os dois falham.
      #
      # O efeito era pior que dois casos vermelhos: a CI de `development` ficou vermelha por
      # dias seguidos, e uma CI que sempre falha para de ser lida. Na máquina de quem
      # desenvolve o navegador já está instalado de outras rodadas, então passava.
      - name: Install Chromium (backend + e2e)
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # `npm test` particiona a suíte: os arquivos que sobem um mongod de verdade
      # rodam com concorrência limitada, o resto em paralelo total. Ver
      # backend/scripts/run-tests.mjs — o runner do GitHub é menor que a máquina
      # de quem desenvolve, e a suíte inteira em paralelo pedia mais do que ele tem.
      - name: Backend tests
        # `shell: bash` traz `pipefail` junto: sem ele o `tee` engoliria a falha e o
        # passo ficaria verde com a suíte vermelha.
        shell: bash
        run: npm test -w backend 2>&1 | tee /tmp/backend-tests.log

      # O log completo do job exige permissão de administrador; as anotações são
      # públicas. Sem isto, uma falha que só acontece no runner é uma falha que não dá
      # para ler — e foi exatamente o que aconteceu.
      - name: "Backend tests: diagnóstico da falha"
        if: failure()
        shell: bash
        run: |
          # O BLOCO INTEIRO de cada falha, e não só os rótulos.
          #
          # O filtro anterior pegava `error: |-` — que é o RÓTULO. A mensagem vem nas linhas
          # seguintes, indentadas, e ficava de fora: a anotação dizia "houve um AssertionError"
          # sem dizer qual. Uma falha que só acontece no runner e não pode ser lida é uma falha
          # que vira adivinhação, e foi exatamente o que aconteceu.
          #
          # `-A 12` cobre o bloco YAML que o `node --test` escreve depois de cada `not ok`.
          # Sem log não há o que diagnosticar: este passo roda em QUALQUER falha anterior, e
          # falhar por não achar arquivo esconderia a falha de verdade — o oposto do que ele faz.
          [ -f /tmp/backend-tests.log ] || { echo "::warning::a suíte do backend não chegou a rodar"; exit 0; }
          grep -E -A 12 '^not ok' /tmp/backend-tests.log \
            | head -80 \
            | while IFS= read -r linha; do
                [ -z "${linha// /}" ] && continue
                echo "::error::${linha:0:400}"
              done
          echo "::error::(as linhas acima saem do relatório TAP do node --test)"

      - name: Frontend unit tests
        run: npm test -w frontend

      # O widget embutido é a única parte do produto que roda no site de OUTRA pessoa: o
      # loader carrega de uma origem e fala com outra, e quando isso quebra não há erro
      # visível em lugar nenhum — o chat simplesmente não aparece. Foi assim que ele
      # ficou fora do ar sem ninguém notar.
      #
      # A jornada existia e não rodava aqui. Um teste que não roda é um teste que não
      # protege nada. (O Chromium já foi instalado antes dos testes de backend.)

      # `--workers=1`: as jornadas do widget compartilham chave pública e rotas
      # interceptadas, e em paralelo uma interceptação atende o pedido da outra.
      - name: Widget embed e2e (Chromium)
        run: npx playwright test e2e/widget-embed.spec.ts --project=chromium --workers=1
        working-directory: frontend

      # O App de WebSocket é a única superfície do produto cujas telas dependem de um
      # App ATIVADO para renderizar: o guarda de superfície recusa a página quando ele
      # não está. Um erro aí não aparece como exceção — a página simplesmente fica
      # vazia, que é o mesmo sintoma de "nada configurado ainda".
      #
      # `E2E_PREVIEW=1` serve o app COMPILADO (o passo de build acima já produziu o
      # `dist`) em vez de subir um segundo servidor de desenvolvimento. É o que faz esta
      # jornada exercitar o mesmo binário que vai para produção — inclusive com as flags
      # de build no estado real, que é justamente onde a última falha se escondia: na
      # máquina de quem desenvolve há um `frontend/.env` que liga tudo, e aqui não.
      #
      # Os stubs desta jornada compartilham rota interceptada, então `--workers=1` pelo
      # mesmo motivo do widget.
      - name: WebSocket App e2e (Chromium)
        run: npx playwright test e2e/websocket-app.spec.ts --project=chromium --workers=1
        working-directory: frontend
        env:
          E2E_PREVIEW: '1'

      # "Montar operação" é a única tela do produto que CRIA estrutura — andar, agentes
      # e setores de uma vez. O que esta jornada segura é a promessa que a tela faz:
      # nada existe antes da confirmação, e a confirmação carrega o hash da proposta
      # que a pessoa de fato revisou.
      #
      # Contra o app compilado, pelo mesmo motivo do passo acima: é onde as flags de
      # build ficam no estado real.
      - name: Arquiteto e2e (Chromium)
        run: npx playwright test e2e/architect-app.spec.ts --project=chromium --workers=1
        working-directory: frontend
        env:
          E2E_PREVIEW: '1'

      # O relatório vira artefato SÓ quando quebra. O log completo do job exige permissão
      # de administrador; sem isto, um passo vermelho num repositório de outra pessoa é um
      # passo que não dá para ler — foi exatamente o que aconteceu aqui.
      - name: "E2E: relatório da falha"
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      # As imagens são construídas no CI porque um Dockerfile que só é exercitado na
      # hora do deploy é um Dockerfile que falha na hora do deploy. Aqui o custo de
      # descobrir é um job vermelho; lá, é um rollback.
      - name: Build backend image
        run: docker build -t comunicacaoai-backend:ci backend

      - name: Build frontend image
        run: docker build -t comunicacaoai-frontend:ci --build-arg VITE_API_URL=https://api.comunicacaoai.onplataform.com frontend

      # Os dois workers também. O comentário acima vale INTEIRO para eles, e eles eram
      # justamente os que ninguém construía: o Dockerfile do browser-worker declarava
      # `playwright` no `package.json` e não instalava nada — a imagem base traz o navegador,
      # não o pacote npm. A falha é silenciosa por desenho (`loadEngine` devolve `null` para o
      # worker não morrer sem navegador), então o container subia, o healthcheck de TCP passava,
      # e o que se via era uma fonte de página que nunca renderizava.
      - name: Build runner image
        run: docker build -t comunicacaoai-runner:ci runner

      - name: Build browser-worker image
        run: docker build -t comunicacaoai-browser-worker:ci browser-worker

      # E o worker do browser é LEVANTADO, porque construir não prova que ele renderiza.
      #
      # `/health` carrega o motor de verdade e diz se ele existe — é o único lugar onde a
      # diferença entre "o processo está de pé" e "o navegador abre" aparece. O healthcheck do
      # Dockerfile é TCP de propósito (o endpoint exige assinatura), então esta conferência
      # precisa vir de fora, com o segredo.
      # E o worker do browser é LEVANTADO, porque construir não prova que ele renderiza.
      #
      # `/health` carrega o motor DE VERDADE e responde `capabilities.render` — é o único lugar
      # onde a diferença entre "o processo está de pé" e "o navegador abre" aparece. O
      # healthcheck do Dockerfile é TCP de propósito (o endpoint exige assinatura), então esta
      # conferência precisa vir de fora, assinada como o backend assina.
      - name: O browser-worker RENDERIZA (não só sobe)
        run: |
          set -euo pipefail
          SEGREDO="ci-$(openssl rand -hex 16)"
          docker run -d --name bw-ci \
            --cap-drop=ALL --security-opt no-new-privileges \
            --memory 1g --memory-swap 1g --cpus 1 --pids-limit 512 \
            --tmpfs /tmp:rw,nosuid,size=256m \
            -e BROWSER_WORKER_SECRET="$SEGREDO" \
            -p 4400:4400 comunicacaoai-browser-worker:ci

          # O processo precisa aceitar conexão antes de a pergunta fazer sentido.
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/4400) >/dev/null 2>&1 && break
            sleep 2
          done

          # A assinatura é a mesma de `browser-worker/src/auth.mjs`: HMAC sobre
          # `timestamp.nonce.corpo`, com nonce de uso único e janela de tempo.
          SAUDE=$(BW_SECRET="$SEGREDO" node -e '
            const { createHmac, randomUUID } = require("node:crypto")
            const secret = process.env.BW_SECRET
            const timestamp = Date.now()
            const nonce = randomUUID()
            const assinatura = createHmac("sha256", secret).update(`${timestamp}.${nonce}.`).digest("hex")
            fetch("http://127.0.0.1:4400/health", {
              headers: {
                "x-sandbox-timestamp": String(timestamp),
                "x-sandbox-nonce": nonce,
                "x-sandbox-signature": assinatura,
              },
            })
              .then((r) => r.text())
              .then((t) => console.log(t))
              .catch((e) => { console.log(JSON.stringify({ erro: String(e.message) })); process.exit(0) })
          ')
          echo "health: $SAUDE"
          docker logs bw-ci 2>&1 | tail -20
          docker rm -f bw-ci >/dev/null 2>&1 || true

          # `render: false` é o defeito que este passo existe para pegar: o worker de pé, sem
          # navegador, e nenhum alarme em lugar nenhum. Era o estado da imagem até este commit.
          echo "$SAUDE" | grep -q '"render":true' || {
            echo "::error::o browser-worker subiu SEM motor de renderizacao: import(playwright) nao resolve dentro da imagem"
            exit 1
          }

      # A imagem carrega mais coisa que o nosso código: base, runtime e tudo o que veio
      # junto. Falha ALTA ou CRÍTICA com correção disponível derruba o job — sem correção
      # publicada, não há o que fazer no merge, e travar aí só ensinaria a ignorar.
      - name: Scan das imagens (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: comunicacaoai-backend:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan da imagem do frontend (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: comunicacaoai-frontend:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Sobe a pilha com `NODE_ENV=production` e as origens públicas reais: a validação
      # de produção roda por inteiro, sem flag de escape. O banco vem do override do CI
      # (`compose.ci-smoke.yml`) — efêmero, sem credencial, sem porta exposta.
      #
      # Em ETAPAS NOMEADAS de propósito: quando o smoke quebra, o nome do passo já diz onde
      # — banco, aplicação ou probe. Num passo único, "Docker smoke falhou" obriga a abrir o
      # log, e o log de um repositório de outra pessoa nem sempre está ao alcance.
      #
      # A limpeza é um passo `if: always()`: roda mesmo com falha, timeout ou cancelamento,
      # que é mais do que um `trap` cobre — um job morto não executa trap nenhum, e um Mongo
      # órfão segurando volume é a sujeira que só aparece três execuções depois.
      - name: "Smoke: banco efêmero de pé"
        run: |
          set -euo pipefail
          cp compose.production-test.env.example compose.production-test.env
          # Os segredos do EXEMPLO são recusados pela validação de produção — de
          # propósito, para ninguém subir com eles. O CI gera os seus, diferentes entre
          # si, que morrem junto com o job.
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|" compose.production-test.env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" compose.production-test.env
          # Saudável aqui significa "existe um primário para escrever" — o healthcheck do
          # override responde isso pelo código de saída.
          docker compose $COMPOSE_ARGS up -d --wait --wait-timeout 150 mongo

      - name: "Smoke: backend de pé"
        run: docker compose $COMPOSE_ARGS up -d --build --wait --wait-timeout 240 backend

      - name: "Smoke: frontend de pé"
        run: docker compose $COMPOSE_ARGS up -d --build --wait --wait-timeout 180 frontend

      - name: "Smoke: /api/ready e /healthz respondem"
        run: |
          set -euo pipefail
          # `/api/ready` só devolve 200 com o banco acessível E o motor de automações no ar:
          # é o sinal honesto de "a pilha subiu", não "o processo existe".
          curl -fsS http://localhost:4000/api/ready | grep -q '"ready"'
          curl -fsS http://localhost:8080/healthz > /dev/null
          echo "smoke ok: /api/ready e /healthz responderam"

      # O diagnóstico vira ANOTAÇÃO do run, e não só linha de log: quem abre o resumo do CI
      # lê o estado dos contêineres e o fim do log do backend sem precisar caçar dentro do
      # passo que falhou. Roda antes da limpeza, senão o `down -v` já teria levado os logs.
      # `hashFiles` só enxerga o arquivo se ele existir: quando o E2E cai ANTES do passo
      # que o cria, a pilha nunca subiu, e um diagnóstico sobre contêineres que não
      # existem só produz anotação falsa — dizendo que falta um arquivo que ninguém
      # deveria ter criado ainda.
      - name: "Smoke: diagnóstico da falha"
        if: failure() && hashFiles('compose.production-test.env') != ''
        run: |
          anotar() {
            printf '::error title=%s::%s\n' "$1" "$(printf '%s' "$2" | tail -c 2500 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')"
          }
          anotar "smoke: estado dos contêineres" "$(docker compose $COMPOSE_ARGS ps -a 2>&1 || true)"
          anotar "smoke: fim do log do backend"  "$(docker compose $COMPOSE_ARGS logs --no-color --tail=25 backend 2>&1 || true)"
          anotar "smoke: fim do log do frontend" "$(docker compose $COMPOSE_ARGS logs --no-color --tail=15 frontend 2>&1 || true)"
          anotar "smoke: fim do log do mongo"    "$(docker compose $COMPOSE_ARGS logs --no-color --tail=15 mongo 2>&1 || true)"

      - name: "Smoke: logs e limpeza"
        # Mesma razão do passo acima: sem o arquivo de ambiente não há pilha para
        # derrubar, e `docker compose` reclamaria de um arquivo ausente como se fosse
        # problema — escondendo a falha de verdade atrás de ruído.
        if: always() && hashFiles('compose.production-test.env') != ''
        run: |
          docker compose $COMPOSE_ARGS ps -a || true
          echo "--- logs backend ---"; docker compose $COMPOSE_ARGS logs --no-color --tail=120 backend || true
          echo "--- logs frontend ---"; docker compose $COMPOSE_ARGS logs --no-color --tail=40 frontend || true
          echo "--- logs mongo ---";   docker compose $COMPOSE_ARGS logs --no-color --tail=40 mongo || true
          docker compose $COMPOSE_ARGS down -v --remove-orphans || true



  # O smoke roda a pilha de verdade num navegador. Fica num job próprio porque
  # precisa do Chromium e leva mais tempo que o gate — e porque, quando ele quebra,
  # o que quebrou é o produto, não uma unidade.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # `npm run smoke` compila os dois workspaces, sobe mongod + API + frontend
      # estático e roda o Playwright contra a pilha. Nenhum segredo, nenhuma conta
      # e nenhuma chave de provedor — se precisasse de alguma, não rodaria aqui.
      - name: MVP smoke (Chromium)
        run: npm run smoke

  # Análise estática do nosso código, em job próprio: ela demora e não deve segurar o
  # retorno dos testes. `security-events: write` é o que permite publicar o resultado na
  # aba Security — e é permissão que só este job recebe.
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}
          # `security-extended` inclui as consultas de injeção e de SSRF — que é
          # exatamente a classe que este repositório tem mais superfície para cometer.
          queries: security-extended

      - name: Analisar
