# Every push and pull request on main/development gets the same checks a developer
# runs locally: a clean install, typecheck, build and both test suites.
#
# Deliberately hermetic: no secrets, no deploy, no seed, no call to any external
# service. The backend integration tests start their own mongod through
# mongodb-memory-server and talk to a throwaway Redis service container, so the
# automation queue and scheduler are exercised for real. The E2E suite is not run
# here (it needs browsers and a live backend; it stays a local gate).
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The automation machinery (run queue + scheduler) is only really covered when a
    # Redis answers; without it that suite skips and the pipeline goes unverified.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # A syntactically valid URI so modules that read it at import time can load.
      # Nothing connects to it: the integration tests override it with their own
      # in-process mongod.
      MONGODB_URI: mongodb://127.0.0.1:27017/comunicacaoai_ci
      # The integration suite pins its own isolated database index on this host.
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to 20.19+: rolldown (vite's bundler) declares
          # engines.node "^20.19.0 || >=22.12.0", and on an older 20.x npm silently
          # skips its native binding, so the build dies with "Cannot find native
          # binding" instead of a useful error.
          node-version: '20.19'
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Typecheck (backend)
        run: npx tsc --noEmit
        working-directory: backend

      - name: Typecheck (frontend)
        run: npx tsc -b --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build

      - name: Backend tests
        run: npm test -w backend

      - name: Frontend unit tests
        run: npm test -w frontend
