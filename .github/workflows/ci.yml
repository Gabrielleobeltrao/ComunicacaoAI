# Every push and pull request on main/development gets the same checks a developer
# runs locally: a clean install, typecheck, build, both test suites — e o smoke de
# MVP, que sobe a pilha inteira e a exercita como um usuário.
#
# Deliberately hermetic: no secrets, no deploy, no seed, no call to any external
# service, and no broker — the automation queue and scheduler live in MongoDB, and
# both the integration tests and the smoke start their own mongod through
# mongodb-memory-server. O LLM do smoke é um adaptador falso que só existe com
# NODE_ENV=test (backend/test/llmFakeGate.test.mjs prova que produção não alcança).
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A syntactically valid URI so modules that read it at import time can load.
      # Nothing connects to it: the integration tests override it with their own
      # in-process mongod.
      MONGODB_URI: mongodb://127.0.0.1:27017/comunicacaoai_ci
      CI: true
      # Um só lugar define a pilha do smoke, e os quatro passos abaixo usam o mesmo — inclusive
      # o da limpeza, que precisa apontar para exatamente os mesmos arquivos para derrubar o
      # que subiu.
      COMPOSE_ARGS: -f compose.production-test.yml -f compose.ci-smoke.yml --env-file compose.production-test.env
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Pinned to 20.19+: rolldown (vite's bundler) declares
          # engines.node "^20.19.0 || >=22.12.0", and on an older 20.x npm silently
          # skips its native binding, so the build dies with "Cannot find native
          # binding" instead of a useful error.
          node-version: '20.19'
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Typecheck (backend)
        run: npx tsc --noEmit
        working-directory: backend

      - name: Typecheck (frontend)
        run: npx tsc -b --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build

      # O binário do mongod entre execuções. Sem isto, cada run baixa 76 MB de
      # novo — e era num cache frio que 29 processos disputavam o mesmo download.
      - name: Cache mongod binary
        # v5: a v4 roda em Node 20, que o runner já avisa que vai sair. O aviso não
        # quebra nada hoje e vira falha quando o Node 20 for removido — trocar agora é
        # mais barato que descobrir no dia.
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}

      # `npm test` particiona a suíte: os arquivos que sobem um mongod de verdade
      # rodam com concorrência limitada, o resto em paralelo total. Ver
      # backend/scripts/run-tests.mjs — o runner do GitHub é menor que a máquina
      # de quem desenvolve, e a suíte inteira em paralelo pedia mais do que ele tem.
      - name: Backend tests
        # `shell: bash` traz `pipefail` junto: sem ele o `tee` engoliria a falha e o
        # passo ficaria verde com a suíte vermelha.
        shell: bash
        run: npm test -w backend 2>&1 | tee /tmp/backend-tests.log

      # O log completo do job exige permissão de administrador; as anotações são
      # públicas. Sem isto, uma falha que só acontece no runner é uma falha que não dá
      # para ler — e foi exatamente o que aconteceu.
      - name: "Backend tests: diagnóstico da falha"
        if: failure()
        shell: bash
        run: |
          grep -E '^not ok|^ *error:|^ *code:|failureType|AssertionError|Error:' /tmp/backend-tests.log \
            | head -40 \
            | while IFS= read -r linha; do echo "::error::${linha:0:400}"; done
          echo "::error::(as linhas acima saem do relatório TAP do node --test)"

      - name: Frontend unit tests
        run: npm test -w frontend

      # O widget embutido é a única parte do produto que roda no site de OUTRA pessoa: o
      # loader carrega de uma origem e fala com outra, e quando isso quebra não há erro
      # visível em lugar nenhum — o chat simplesmente não aparece. Foi assim que ele
      # ficou fora do ar sem ninguém notar.
      #
      # A jornada existia e não rodava aqui. Um teste que não roda é um teste que não
      # protege nada.
      - name: Install Chromium (widget e2e)
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # `--workers=1`: as jornadas do widget compartilham chave pública e rotas
      # interceptadas, e em paralelo uma interceptação atende o pedido da outra.
      - name: Widget embed e2e (Chromium)
        run: npx playwright test e2e/widget-embed.spec.ts --project=chromium --workers=1
        working-directory: frontend

      # As imagens são construídas no CI porque um Dockerfile que só é exercitado na
      # hora do deploy é um Dockerfile que falha na hora do deploy. Aqui o custo de
      # descobrir é um job vermelho; lá, é um rollback.
      - name: Build backend image
        run: docker build -t comunicacaoai-backend:ci backend

      - name: Build frontend image
        run: docker build -t comunicacaoai-frontend:ci --build-arg VITE_API_URL=https://api.comunicacaoai.onplataform.com frontend

      # Sobe a pilha com `NODE_ENV=production` e as origens públicas reais: a validação
      # de produção roda por inteiro, sem flag de escape. O banco vem do override do CI
      # (`compose.ci-smoke.yml`) — efêmero, sem credencial, sem porta exposta.
      #
      # Em ETAPAS NOMEADAS de propósito: quando o smoke quebra, o nome do passo já diz onde
      # — banco, aplicação ou probe. Num passo único, "Docker smoke falhou" obriga a abrir o
      # log, e o log de um repositório de outra pessoa nem sempre está ao alcance.
      #
      # A limpeza é um passo `if: always()`: roda mesmo com falha, timeout ou cancelamento,
      # que é mais do que um `trap` cobre — um job morto não executa trap nenhum, e um Mongo
      # órfão segurando volume é a sujeira que só aparece três execuções depois.
      - name: "Smoke: banco efêmero de pé"
        run: |
          set -euo pipefail
          cp compose.production-test.env.example compose.production-test.env
          # Saudável aqui significa "existe um primário para escrever" — o healthcheck do
          # override responde isso pelo código de saída.
          docker compose $COMPOSE_ARGS up -d --wait --wait-timeout 150 mongo

      - name: "Smoke: backend de pé"
        run: docker compose $COMPOSE_ARGS up -d --build --wait --wait-timeout 240 backend

      - name: "Smoke: frontend de pé"
        run: docker compose $COMPOSE_ARGS up -d --build --wait --wait-timeout 180 frontend

      - name: "Smoke: /api/ready e /healthz respondem"
        run: |
          set -euo pipefail
          # `/api/ready` só devolve 200 com o banco acessível E o motor de automações no ar:
          # é o sinal honesto de "a pilha subiu", não "o processo existe".
          curl -fsS http://localhost:4000/api/ready | grep -q '"ready"'
          curl -fsS http://localhost:8080/healthz > /dev/null
          echo "smoke ok: /api/ready e /healthz responderam"

      # O diagnóstico vira ANOTAÇÃO do run, e não só linha de log: quem abre o resumo do CI
      # lê o estado dos contêineres e o fim do log do backend sem precisar caçar dentro do
      # passo que falhou. Roda antes da limpeza, senão o `down -v` já teria levado os logs.
      - name: "Smoke: diagnóstico da falha"
        if: failure()
        run: |
          anotar() {
            printf '::error title=%s::%s\n' "$1" "$(printf '%s' "$2" | tail -c 2500 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')"
          }
          anotar "smoke: estado dos contêineres" "$(docker compose $COMPOSE_ARGS ps -a 2>&1 || true)"
          anotar "smoke: fim do log do backend"  "$(docker compose $COMPOSE_ARGS logs --no-color --tail=25 backend 2>&1 || true)"
          anotar "smoke: fim do log do frontend" "$(docker compose $COMPOSE_ARGS logs --no-color --tail=15 frontend 2>&1 || true)"
          anotar "smoke: fim do log do mongo"    "$(docker compose $COMPOSE_ARGS logs --no-color --tail=15 mongo 2>&1 || true)"

      - name: "Smoke: logs e limpeza"
        if: always()
        run: |
          docker compose $COMPOSE_ARGS ps -a || true
          echo "--- logs backend ---"; docker compose $COMPOSE_ARGS logs --no-color --tail=120 backend || true
          echo "--- logs frontend ---"; docker compose $COMPOSE_ARGS logs --no-color --tail=40 frontend || true
          echo "--- logs mongo ---";   docker compose $COMPOSE_ARGS logs --no-color --tail=40 mongo || true
          docker compose $COMPOSE_ARGS down -v --remove-orphans || true



  # O smoke roda a pilha de verdade num navegador. Fica num job próprio porque
  # precisa do Chromium e leva mais tempo que o gate — e porque, quando ele quebra,
  # o que quebrou é o produto, não uma unidade.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # `npm run smoke` compila os dois workspaces, sobe mongod + API + frontend
      # estático e roda o Playwright contra a pilha. Nenhum segredo, nenhuma conta
      # e nenhuma chave de provedor — se precisasse de alguma, não rodaria aqui.
      - name: MVP smoke (Chromium)
        run: npm run smoke
