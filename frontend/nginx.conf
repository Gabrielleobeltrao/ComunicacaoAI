# SPA static serving for the frontend container (unprivileged nginx, port 8080).
# The backend lives on a separate origin (VITE_API_URL), so this server never
# proxies /api — it only serves the built SPA + widget assets.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never sniff MIME types; the widget must stay embeddable on third-party
    # sites, so we deliberately do NOT set X-Frame-Options / a framing CSP here.
    add_header X-Content-Type-Options "nosniff" always;

    # Container liveness for the orchestrator.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # index.html must always be revalidated so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build assets are immutable — cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # The embeddable widget loader is served as-is (short cache so updates land).
    location = /widget-loader.js {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # SPA fallback: any unknown path renders index.html (client-side routing),
    # so deep links like /dashboard or /widget/<key> do not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
